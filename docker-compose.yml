services:
  postgres:
    image: postgres:16-alpine
    container_name: primavera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-primavera}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - p6-network

  document-parser:
    build:
      context: ./document-parser
      dockerfile: Dockerfile
    container_name: primavera-document-parser
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    networks:
      - p6-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: primavera-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - p6-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: primavera-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-primavera}
      - PARSER_URL=http://document-parser:8001
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=sih-artifacts
      - MINIO_SECURE=false
      - TIME_AGENT_GEMINI_API_KEY=${TIME_AGENT_GEMINI_API_KEY:-}
      - TIME_AGENT_LLM_MODEL=${TIME_AGENT_LLM_MODEL:-gemini-3.6-flash}
      - EXTRACTION_GEMINI_API_KEY=${EXTRACTION_GEMINI_API_KEY:-}
      - EXTRACTION_LLM_MODEL=${EXTRACTION_LLM_MODEL:-gemini-3.5-flash}
      - ALLOW_LEGACY_GEMINI_FALLBACK=${ALLOW_LEGACY_GEMINI_FALLBACK:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      document-parser:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - p6-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: primavera-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    networks:
      - p6-network

networks:
  p6-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
